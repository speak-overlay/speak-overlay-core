services:
  # === MINIO SERVER ===
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # === SETUP AUTOMÁTICO DE USUARIO Y BUCKET ===
  minio-setup:
    build: ./minio-setup
    depends_on:
      - minio
    environment:
      MINIO_SERVER: http://minio:9000
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
      MINIO_NEW_USER: mainuser
      MINIO_NEW_PASSWORD: mainsecret123
      MINIO_BUCKET: main-bucket
    restart: "no"

volumes:
  minio_data:
